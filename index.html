<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://spatial-img.information.qld.gov.au; connect-src 'self' https://spatial-gis.information.qld.gov.au https://api.met.no; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">

<meta name="mobile-web-app-capable" content="yes">
<title>STEL Field</title>
<link rel="manifest" href="manifest.webmanifest">

<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="styles.css">

<body>
<div class="wrap">

    <span class="mast-mark">STEL</span>

</div>
<nav class="tabs" id="tabs" aria-label="Main">

  <button class="tab" data-tab="clients" type="button">Clients</button>

</nav>
<noscript>This app needs JavaScript switched on.</noscript>
<script src="calc.js"></script>

<script src="logo.js"></script>

</html>
