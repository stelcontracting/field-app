<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- The browser refuses every connection except the few optional internet extras named here. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://spatial-img.information.qld.gov.au; connect-src 'self' https://spatial-gis.information.qld.gov.au https://api.met.no https://login.microsoftonline.com https://graph.microsoft.com; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#262261">
<meta name="mobile-web-app-capable" content="yes">
<title>STEL Field</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header class="mast">
    <img class="mast-logo" id="mastLogo" alt="STEL" width="88" height="40">
    <span class="mast-title" id="mastTitle">Field</span>
    <span class="saved" id="savedFlag" aria-live="polite"></span>
  </header>
  <main id="app"><div class="loading">Opening your records…</div></main>
</div>
<nav class="tabs" id="tabs" aria-label="Main">
  <button class="tab" data-tab="home" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8M5 9.5V21h5v-6h4v6h5V9.5"/></svg>Home</button>
  <button class="tab" data-tab="mix" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3M7.5 15h9"/></svg>Mix</button>
  <button class="tab" data-tab="clients" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/><circle cx="9" cy="7" r="4"/></svg>Clients</button>
  <button class="tab" data-tab="quotes" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h7"/></svg>Quotes</button>
  <button class="tab" data-tab="jobs" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5h12M8 12h12M8 19h12M3.5 5h.01M3.5 12h.01M3.5 19h.01"/></svg>Jobs</button>
</nav>
<noscript>This app needs JavaScript switched on.</noscript>
<script src="calc.js"></script>
<script src="rates.js"></script>
<script src="logo.js"></script>
<script src="sync.js"></script>
<script src="app.js"></script>
</body>
</html>
